services:
  api:
    build:
      context: .
      dockerfile: ./docker/production/django/Dockerfile
    container_name: api
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - postgres-db
      - redis
    networks:
      - fpl-vue

  postgres-db:
    image: postgres:12.0-alpine
    # Bound to loopback only: the app reaches this over the fpl-vue network.
    # For psql from your laptop, tunnel it: ssh -L 5432:localhost:5432 <host>
    ports:
      - "127.0.0.1:5432:5432"
    container_name: postgres-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - fpl-vue

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - fpl-vue

  nginx:
    restart: always
    container_name: nginx
    depends_on:
      - api
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./docker/production/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Serves mogul.fantasykenya.com from the mogul.manager stack. Loads
      # after default.conf alphabetically, so fantasykenya.com stays the
      # default server for unmatched hostnames.
      - ./docker/production/nginx/mogul.conf:/etc/nginx/conf.d/mogul.conf

    build:
      context: ./client
      dockerfile: ./production/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    # Reload every 6h so renewed certs get picked up without a manual restart.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    networks:
      - fpl-vue

  celery_worker:
    build:
      context: .
      dockerfile: ./docker/production/django/Dockerfile
    command: /start-celeryworker
    container_name: worker
    volumes:
      - .:/app
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - redis
      - postgres-db
    networks:
      - fpl-vue

  celery_beat:
    build:
      context: .
      dockerfile: ./docker/production/django/Dockerfile
    container_name: beat
    command: /start-celerybeat
    volumes:
      - .:/app
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - redis
      - postgres-db
    networks:
      - fpl-vue

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Wakes every 12h, renews anything inside 30 days of expiry, then sleeps.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    depends_on:
      - nginx
    networks:
      - fpl-vue
    restart: always

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium
    shm_size: 2gb
    ports:
      - "127.0.0.1:4444:4444"
    environment:
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_NODE_SESSION_RETRY_INTERVAL=5
    networks:
      - fpl-vue
    restart: always

networks:
  fpl-vue:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_www:
