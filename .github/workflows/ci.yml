name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12.0-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fantasy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      PG_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: fantasy_test
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - name: flake8
        run: flake8 .
      - name: black (check)
        run: black --check --exclude='migrations|venv|client' .
      - name: isort (check)
        run: isort . --check-only --skip env --skip migrations --skip .venv --skip client
      - name: pytest
        run: |
          set +e
          pytest -p no:warnings --cov=.
          code=$?
          set -e
          # pytest exits 5 when zero tests are collected; treat as pass for now
          if [ "$code" -eq 5 ]; then echo "No tests collected — skipped."; exit 0; fi
          exit $code

  frontend-build:
    name: Frontend · type-check & build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: client }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build   # vue-tsc type-check + vite build

  auto-fix:
    name: Auto-fix formatting (black & isort)
    needs: [backend-checks, frontend-build]
    # Pull requests only. On master its commit cannot green the build anyway —
    # a push made with GITHUB_TOKEN does not trigger a new run — and it would
    # rewrite master unreviewed. Locally: `make fmt`.
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install black==24.8.0 isort==5.13.2
      - run: black --exclude='migrations|venv|client' .
      - run: isort . --skip env --skip migrations --skip .venv --skip client
      - name: Commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code with black & isort"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

  deploy:
    name: Deploy to Contabo VPS
    needs: [backend-checks, frontend-build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Pull, rebuild and restart on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only origin master
            compose="docker compose -f docker-compose.prod.yml --env-file .env.prod"
            $compose up --build -d --remove-orphans
            # nginx.conf is bind-mounted, so explicitly reload it after every
            # deploy rather than waiting for its six-hour reload loop.
            $compose exec -T nginx nginx -s reload
            # `up -d` returns before the api container can accept an exec, so
            # the first migrate can lose the race. Migrations are idempotent,
            # so retrying is safe and cheaper than guessing a sleep.
            migrated=""
            for attempt in 1 2 3 4 5 6; do
              if $compose exec -T api python3 manage.py migrate --no-input; then
                migrated="yes"
                break
              fi
              echo "api not ready yet (attempt $attempt) — retrying in 5s"
              sleep 5
            done
            if [ -z "$migrated" ]; then
              echo "migrate never succeeded; last 50 lines from api:"
              $compose logs --tail 50 api
              exit 1
            fi
            $compose exec -T api python3 manage.py collectstatic --no-input --clear