# ─────────────────────────────────────────────────────────────────────
# mogul.manager, served from the same edge as fantasykenya.com.
#
# The mogul.manager stack (~/mogul.manager, docker-compose.prod.yml) binds
# nothing public — its web container sits on 127.0.0.1:8080 and joins this
# stack's fpl-vue network, so `mogul-web` resolves from inside this container.
# Bring that stack up after this one; it declares fpl-vue as external.
#
# This file loads after default.conf (conf.d/*.conf is included in
# alphabetical order), so fantasykenya.com remains the default server for any
# hostname that matches nothing here.
#
# The certificate is a separate lineage from fantasykenya.com's. To issue it:
#
#   docker compose -f docker-compose.prod.yml run --rm --entrypoint "\
#     certbot certonly --webroot -w /var/www/certbot \
#     -d mogul.fantasykenya.com --email ian@t4glab.com \
#     --agree-tos --no-eff-email" certbot
#
# Do NOT add -d fantasykenya.com to that command: it would expand the existing
# lineage instead of creating a new one. Issue the cert BEFORE this file is
# first mounted — nginx refuses to start on a missing ssl_certificate, which
# would take fantasykenya.com down with it. Renewal is automatic afterwards;
# the certbot container's 12h loop picks up every lineage.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name mogul.fantasykenya.com;

    # Must stay above the redirect — certbot renewal reads it over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mogul.fantasykenya.com;

    ssl_certificate     /etc/letsencrypt/live/mogul.fantasykenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mogul.fantasykenya.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # X-Frame-Options is set by the app itself (DENY, stricter than KFL's
    # SAMEORIGIN) — don't add a second, weaker one here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8M;

    # Docker's embedded DNS, resolved per request via the $upstream_mogul
    # variable. This matters more here than anywhere else: a plain
    # `upstream { server mogul-web:80; }` makes nginx fail to START when
    # mogul-web is absent — which would take fantasykenya.com down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_mogul http://mogul-web:80;

    # Everything — SPA and /api — goes to mogul-web, which splits it.
    # A variable in proxy_pass suppresses automatic URI pass-through, so
    # $request_uri is appended by hand.
    location / {
        proxy_pass $upstream_mogul$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # SSE: /api/notifications/stream and the chat endpoint stay open and
        # must not be buffered at either hop.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
