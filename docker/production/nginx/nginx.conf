upstream api {
    server api:8000;
}

# Do not route scanner traffic with an unknown Host to Django. Without these
# default virtual hosts, nginx selects the first server and /api/v1 requests
# reach Django, where they only generate DisallowedHost errors.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # nginx requires a certificate before it can reject an HTTPS request. These
    # are the same files used by the only public application virtual host.
    ssl_certificate /etc/letsencrypt/live/fantasykenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasykenya.com/privkey.pem;
    return 444;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name fantasykenya.com www.fantasykenya.com;

    # ACME challenge must be served over HTTP, before the HTTPS redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name fantasykenya.com www.fantasykenya.com;

    # This is nginx's default HTTPS server as well. Do not forward arbitrary
    # Host headers to Django, where they become noisy DisallowedHost errors.
    if ($host !~ ^(fantasykenya\.com|www\.fantasykenya\.com)$) {
        return 444;
    }

    client_max_body_size 20M;

   
    ssl_certificate /etc/letsencrypt/live/fantasykenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasykenya.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API routes
    location /api/v1 {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /guardian {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Static files from Django
    location /staticfiles/ {
        alias /app/staticfiles/;
    }

    location /mediafiles/ {
        alias /app/mediafiles/;
    }

    # Serve Vue app static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}