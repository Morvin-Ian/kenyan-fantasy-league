upstream api {
    server api:8000;
}

# Reject requests whose Host header is not one of the site's domains. Without
# this block, nginx's implicit default-server fallback forwards arbitrary Host
# headers (e.g. forum.fantasykenya.com from scanners or stale DNS records) to
# the API with the Host preserved, and Django logs DisallowedHost for every
# probe. Closing the connection here keeps Django's ALLOWED_HOSTS check as a
# second line of defence rather than the first. Requests for
# fantasykenya.com/www.fantasykenya.com still match the named server blocks
# below (an explicit server_name match wins over default_server).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/fantasykenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasykenya.com/privkey.pem;
    return 444;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name fantasykenya.com www.fantasykenya.com;

    # ACME challenge must be served over HTTP, before the HTTPS redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name fantasykenya.com www.fantasykenya.com;
    
    client_max_body_size 20M;

   
    ssl_certificate /etc/letsencrypt/live/fantasykenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasykenya.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API routes
    location /api/v1 {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /guardian {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Static files from Django
    location /staticfiles/ {
        alias /app/staticfiles/;
    }

    location /mediafiles/ {
        alias /app/mediafiles/;
    }

    # Serve Vue app static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}