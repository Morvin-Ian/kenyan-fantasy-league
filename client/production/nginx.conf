upstream api {
    server api:8000;
}

server {
    listen 80;

    client_max_body_size 20M;

    # Django API (all backend routes live under /api/v1/)
    location /api/v1/ {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Django admin
    location /guardian/ {
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Static files from Django (collectstatic output, mounted via static_volume)
    location /staticfiles/ {
        alias /app/staticfiles/;
    }

    # Uploaded media (mounted via media_volume)
    location /mediafiles/ {
        alias /app/mediafiles/;
    }

    # Vue SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
