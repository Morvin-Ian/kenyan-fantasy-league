[flake8]
max-line-length = 88
# Commas matter here: without them the list joins into one bogus entry and
# nothing is excluded at all.
exclude =
    .git,
    __pycache__,
    migrations,
    staticfiles,
    mediafiles,
    venv,
    .venv,
    env,
    node_modules,
    client

# E203 disagrees with black about slice spacing, and black owns line length
# at 88 for everything it can reformat — what E501 still catches is long
# strings, URLs and comments it cannot split.
extend-ignore =
    E203,
    E501

per-file-ignores =
    # Settings modules build on `from .base import *`, so every name they
    # touch looks undefined to pyflakes.
    config/settings/development.py:F403,F405
    config/settings/production.py:F403,F405
